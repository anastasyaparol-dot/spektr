name: Обновить забеги и задеплоить

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC (06:00 МСК)
  workflow_dispatch:        # можно запустить вручную из GitHub

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Установить Playwright браузер
        run: npx playwright install chromium --with-deps

      - name: Запустить парсер
        run: node scripts/scrape.mjs

      - name: Закоммитить обновлённые данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/events-live.json
          git diff --staged --quiet || git commit -m "chore: обновить данные забегов [$(date '+%d.%m.%Y')]"
          git push

      - name: Задеплоить на Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
